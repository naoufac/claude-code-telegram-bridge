<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code · Telegram Bridge</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1c1e26; --muted: #7a8093;
    --accent: #5b5fc7; --ok: #1f9d61; --warn: #e8a13c; --err: #d4524e;
    --line: #e8eaf0; --chip: #f0f1f7;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); padding: 28px 20px 60px;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.busy { background: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  h1 { font-size: 21px; font-weight: 650; letter-spacing: -.2px; }
  .chip {
    background: var(--chip); color: var(--muted); border-radius: 999px;
    padding: 3px 12px; font-size: 12.5px; font-weight: 500;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .stat .v { font-size: 26px; font-weight: 660; margin-top: 4px; letter-spacing: -.5px; }
  .stat .v small { font-size: 14px; color: var(--muted); font-weight: 500; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 18px; }
  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px; font-weight: 650; }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--chip); border-radius: 7px; padding: 2px 8px; color: var(--accent); cursor: pointer; }
  .mono:hover { background: #e4e6f5; }
  .snippet { color: var(--ink); flex: 1 1 240px; min-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12.5px; flex: none; }
  .badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 9px; }
  .okc { color: var(--ok); } .errc { color: var(--err); }
  pre {
    font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; background: #fafbfc;
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: #3a3f4e;
  }
  .empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 16px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: .92; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot" id="dot"></div>
    <h1>Claude Code · Telegram Bridge</h1>
    <span class="chip" id="label">—</span>
    <span class="chip" id="uptime">—</span>
  </header>

  <div class="grid">
    <div class="stat"><div class="k">Status</div><div class="v" id="status">—</div></div>
    <div class="stat"><div class="k">Queue</div><div class="v" id="queue">—</div></div>
    <div class="stat"><div class="k">Runs today</div><div class="v" id="runsToday">—</div></div>
    <div class="stat"><div class="k">Sessions</div><div class="v" id="nSessions">—</div></div>
    <div class="stat"><div class="k">Uploads</div><div class="v" id="nUploads">—</div></div>
  </div>

  <section>
    <h2>Conversations <span style="text-transform:none;font-weight:500">(tap an id to copy /attach)</span></h2>
    <div id="sessions"><div class="empty">loading…</div></div>
  </section>

  <section>
    <h2>Recent runs</h2>
    <div id="runs"><div class="empty">loading…</div></div>
  </section>

  <section>
    <h2>Recent uploads</h2>
    <div id="uploads"><div class="empty">none yet</div></div>
  </section>

  <section>
    <h2>Bridge log</h2>
    <pre id="log">loading…</pre>
  </section>

  <footer>auto-refreshes every 5s · <a href="https://github.com/naoufac/claude-code-telegram-bridge" style="color:var(--muted)">claude-code-telegram-bridge</a></footer>
</div>
<div class="toast" id="toast">copied</div>

<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const $ = id => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // textContent only: no HTML injection
  return e;
}

function fmtUp(s) {
  if (s < 3600) return Math.floor(s / 60) + "m up";
  if (s < 86400) return (s / 3600).toFixed(1) + "h up";
  return (s / 86400).toFixed(1) + "d up";
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1200);
}

function render(d) {
  $("dot").className = "dot" + (d.busy ? " busy" : "");
  $("label").textContent = d.label;
  $("uptime").textContent = fmtUp(d.uptime_s);
  $("status").textContent = d.busy ? "working" : "idle";
  $("status").style.color = d.busy ? "var(--warn)" : "var(--ok)";
  $("queue").textContent = d.queue;
  $("runsToday").textContent = d.runs_today;
  $("nSessions").textContent = d.sessions.length;
  $("nUploads").textContent = d.uploads.length;

  const S = $("sessions"); S.replaceChildren();
  if (!d.sessions.length) S.append(el("div", "empty", "no sessions yet"));
  d.sessions.forEach(s => {
    const row = el("div", "row");
    const id = el("span", "mono", s.id.slice(0, 8));
    id.title = s.id;
    id.onclick = () => navigator.clipboard.writeText("/attach " + s.id.slice(0, 8)).then(() => toast("copied /attach " + s.id.slice(0, 8)));
    row.append(id, el("span", "snippet", s.snippet), el("span", "meta", s.age + " · " + s.kb + " KB"));
    if (s.current) row.append(el("span", "badge", "attached"));
    S.append(row);
  });

  const R = $("runs"); R.replaceChildren();
  if (!d.runs.length) R.append(el("div", "empty", "no runs in the recent log"));
  d.runs.forEach(r => {
    const row = el("div", "row");
    row.append(
      el("span", "meta", r.ts.replace("T", " ").replace("Z", " UTC")),
      el("span", "snippet", r.mins.toFixed(1) + " min"),
      el("span", r.ok ? "meta okc" : "meta errc", r.ok ? "✓ ok" : "✗ error")
    );
    R.append(row);
  });

  const U = $("uploads"); U.replaceChildren();
  if (!d.uploads.length) U.append(el("div", "empty", "none yet"));
  d.uploads.forEach(u => {
    const row = el("div", "row");
    row.append(el("span", "snippet", u.name), el("span", "meta", u.kb + " KB · " + u.ts + " UTC"));
    U.append(row);
  });

  $("log").textContent = d.log || "(empty)";
}

async function tick() {
  try {
    const r = await fetch("/api/state?key=" + encodeURIComponent(KEY), { cache: "no-store" });
    if (!r.ok) { $("status").textContent = "auth?"; return; }
    render(await r.json());
  } catch (e) {
    $("status").textContent = "offline";
    $("status").style.color = "var(--err)";
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
